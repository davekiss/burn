[project]
name = "burn-captions"
version = "0.1.0"
description = "One-word-at-a-time burned-in captions, built for coding agents: local Whisper, agent review, styled ffmpeg render, self-verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
burn = "burn.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
